name: Deploy CareerFinder Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'free-search.js'
      - 'private-api.js'
      - 'application-executor.js'
      - 'application-channels.js'
      - 'zero-experience.js'
      - 'wrangler.jsonc'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: careerfinder-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      # Database migrations and password provisioning are separate administrative operations.
      # Do not rerun schema creation or rotate login credentials on each code deployment.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
