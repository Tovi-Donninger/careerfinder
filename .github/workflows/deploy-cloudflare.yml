name: Deploy CareerFinder Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'private-api.js'
      - 'wrangler.jsonc'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: careerfinder-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute careerfinder-ai --remote --file=migrations/0001_personal_workspace.sql
      - name: Provision secure login password hash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAREERFINDER_LOGIN_PASSWORD: ${{ secrets.CAREERFINDER_LOGIN_PASSWORD }}
        shell: bash
        run: |
          test -n "$CAREERFINDER_LOGIN_PASSWORD" || { echo "::error::Missing CAREERFINDER_LOGIN_PASSWORD repository secret"; exit 1; }
          python3 - <<'PY' > /tmp/careerfinder-password-hash
          import os, hashlib, base64
          password = os.environ["CAREERFINDER_LOGIN_PASSWORD"].encode()
          if len(password) < 16:
              raise SystemExit("CareerFinder login password must be at least 16 characters")
          salt = os.urandom(16)
          digest = hashlib.pbkdf2_hmac("sha256", password, salt, 100000, 32)
          print("100000:" + base64.b64encode(salt).decode() + ":" + base64.b64encode(digest).decode())
          PY
          npx wrangler secret put ADMIN_PASSWORD_HASH < /tmp/careerfinder-password-hash
          rm -f /tmp/careerfinder-password-hash
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
