name: Import ChatGPT job discoveries
on:
  push:
    branches: [main]
    paths:
      - 'recruitment-inbox/**'
      - 'scripts/import-recruitment-inbox.mjs'
      - '.github/workflows/import-recruitment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: careerfinder-recruitment-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public vacancy feed and build import
        run: node scripts/import-recruitment-inbox.mjs
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Import findings into private D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if grep -q 'INSERT INTO recruitment_jobs' /tmp/careerfinder-recruitment-import.sql; then
            npx wrangler d1 execute careerfinder-ai --remote --file=/tmp/careerfinder-recruitment-import.sql
          else
            echo "No vacancy records to import."
          fi
