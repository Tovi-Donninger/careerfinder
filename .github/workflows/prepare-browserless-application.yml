name: CareerFinder Browserless application (prepare or verified auto-submit)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Exact CareerFinder private job ID; leave blank to select next screened employer vacancy'
        required: false
        type: string
      auto_submit:
        description: 'Submit only if all verification checks and employer form requirements pass; otherwise stop for review'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: careerfinder-browser-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test employer vacancy verification
        run: node --test scripts/vacancy-verification.test.mjs
      - name: Check discovery credential
        env:
          CAREERFINDER_AUTOMATION_KEY: ${{ secrets.CAREERFINDER_AUTOMATION_KEY }}
        run: test -n "$CAREERFINDER_AUTOMATION_KEY" || { echo "::error::Missing CAREERFINDER_AUTOMATION_KEY"; exit 1; }
      - name: Discover new vacancies from public feeds
        if: inputs.job_id == ''
        env:
          CAREERFINDER_AUTOMATION_KEY: ${{ secrets.CAREERFINDER_AUTOMATION_KEY }}
        run: node scripts/discover-vacancies.mjs
      - name: Select next employer vacancy when no job ID was supplied
        id: select
        env:
          CAREERFINDER_AUTOMATION_KEY: ${{ secrets.CAREERFINDER_AUTOMATION_KEY }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
        run: |
          if [[ -n "$INPUT_JOB_ID" ]]; then
            echo "job_id=$INPUT_JOB_ID" >> "$GITHUB_OUTPUT"
          else
            node scripts/select-next-application.mjs
          fi
      - name: Check private credentials
        if: steps.select.outputs.job_id != ''
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          CAREERFINDER_AUTOMATION_KEY: ${{ secrets.CAREERFINDER_AUTOMATION_KEY }}
          CAREERFINDER_CV_BASE64: ${{ secrets.CAREERFINDER_CV_BASE64 }}
        run: |
          test -n "$BROWSERLESS_TOKEN" || { echo "::error::Missing BROWSERLESS_TOKEN"; exit 1; }
          test -n "$CAREERFINDER_AUTOMATION_KEY" || { echo "::error::Missing CAREERFINDER_AUTOMATION_KEY"; exit 1; }
          test -n "$CAREERFINDER_CV_BASE64" || { echo "::error::Missing CAREERFINDER_CV_BASE64"; exit 1; }
      - name: Install browser client
        if: steps.select.outputs.job_id != ''
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Prepare one screened employer application (submit only when explicitly enabled)
        if: steps.select.outputs.job_id != ''
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          CAREERFINDER_AUTOMATION_KEY: ${{ secrets.CAREERFINDER_AUTOMATION_KEY }}
          CAREERFINDER_CV_BASE64: ${{ secrets.CAREERFINDER_CV_BASE64 }}
          JOB_ID: ${{ steps.select.outputs.job_id }}
          AUTO_SUBMIT: ${{ vars.CAREERFINDER_ENABLE_AUTO_SUBMIT == 'true' && (github.event_name == 'schedule' || inputs.auto_submit == true) }}
          CAREERFINDER_BROWSER_MONTHLY_UNIT_CAP: '900'
          CAREERFINDER_BROWSER_RESERVE_UNITS: '4'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/careerfinder-cv.pdf private-application-*.json; rm -rf application-receipts .careerfinder-private' EXIT
          printf '%s' "$CAREERFINDER_CV_BASE64" | base64 --decode > /tmp/careerfinder-cv.pdf
          test -s /tmp/careerfinder-cv.pdf
          node scripts/fetch-application-handoff.mjs "$JOB_ID" /tmp/careerfinder-cv.pdf
          set +e
          if [[ "$AUTO_SUBMIT" == "true" ]]; then
            node scripts/employer-form-executor.mjs --application "private-application-${JOB_ID//[^a-zA-Z0-9_-]/}.json" --submit --confirm-authorized
          else
            node scripts/employer-form-executor.mjs --application "private-application-${JOB_ID//[^a-zA-Z0-9_-]/}.json"
          fi
          executor_exit=$?
          set -e
          receipt_files=(application-receipts/*.json)
          if [[ -f "${receipt_files[0]}" ]]; then
            node scripts/upload-application-receipt.mjs "${receipt_files[0]}" "$JOB_ID"
          else
            echo "::error::No browser receipt was created. Manual investigation required."
            exit 1
          fi
          echo "Browser result synchronized. A submitted receipt still requires independent confirmation."
          exit "$executor_exit"
